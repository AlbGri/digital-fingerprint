<!DOCTYPE html>
<html lang="it">
<!--
  File: index.html
  Author: AlbGri
  Copyright: (c) 2025 Alberto G. - Licensed under AGPL-3.0
  Created: 2025-10-26
  Description: Demo didattica di browser fingerprinting
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Profilo di visibilita' "solo col link": l'unica misura che vale anche su github.io -->
    <meta name="robots" content="noindex">

    <meta name="referrer" content="no-referrer">

    <!-- Content Security Policy (CSP) -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self';
        connect-src 'self'
            https://api.ipify.org
            https://api64.ipify.org
            https://ipwho.is
            https://stun.l.google.com:19302
            https://stun1.l.google.com:19302
            https://nominatim.openstreetmap.org
            chrome-extension:;
        style-src 'self';
        img-src 'self' data:;
        frame-src 'none';
        font-src 'self';
        base-uri 'self';
        upgrade-insecure-requests
    ">

    <title>Digital Fingerprint</title>
    <meta name="description" content="Cosa sa di te una pagina web appena la apri, senza cookie">

    <link rel="license" href="https://www.gnu.org/licenses/agpl-3.0.html">

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/style.css">

    <!-- Script in ordine -->
    <script src="js/logger.js" defer></script>
    <script src="js/fingerprint-utils.js" defer></script>
    <script src="js/i18n.js" defer></script>
    <script src="js/clock.js" defer></script>
    <script src="js/reti-datacenter.js" defer></script>
    <script src="js/estensioni-note.js" defer></script>
    <script src="js/fingerprint-extra.js" defer></script>
    <script src="js/fingerprint-viewer.js" defer></script>
    <script src="js/fingerprint-permissions.js" defer></script>
</head>
<body>
    <!-- Skip link per accessibilita WCAG 2.1 -->
    <a href="#fingerprint-section" class="skip-link" data-i18n="pagina.salta"></a>

    <main class="form-container">
        <div class="top-bar">
            <button id="clock" type="button" class="clock" aria-controls="timezone-select"></button>
            <button id="language-toggle" type="button" class="language-toggle"></button>
            <select id="timezone-select" class="timezone-select" hidden></select>
        </div>

        <h1 id="fingerprint-title">Digital Fingerprint</h1>

        <!-- Parte senza permessi: la riempie fingerprint-viewer.js -->
        <section class="fingerprint-section" id="fingerprint-section">
            <div id="fp-ritratto"></div>

            <!-- Cosa farebbe con questi dati chi ha un server: pagina a parte -->
            <p class="fp-server-link"><a class="btn-verde" href="server/" data-i18n="server.titolo"></a></p>

            <div id="fp-content" class="fp-content">
                <p class="fp-loading" data-i18n="pagina.caricamento"></p>
            </div>
        </section>

        <!-- Pulsante per mostrare/nascondere sezione analisi avanzata -->
        <div class="permissions-divider">
            <button
                type="button"
                id="advanced-permissions-toggle"
                class="btn-verde permissions-toggle-button"
                aria-expanded="false"
                aria-controls="advanced-permissions-section"
                data-i18n="permessi.mostra">
            </button>
        </div>

        <!-- Sezione analisi avanzata con permessi -->
        <section id="advanced-permissions-section">
            <h2 data-i18n="permessi.titolo"></h2>
            <p data-i18n="permessi.intro"></p>

            <!-- Card 1: Geolocalizzazione GPS -->
            <details class="permission-card">
                <summary data-i18n="permessi.geo.titolo"></summary>
                <div>
                    <p data-i18n="permessi.geo.testo"></p>
                    <p class="fp-section-tag" data-i18n="permessi.geo.tag"></p>
                    <button
                        type="button"
                        class="btn-verde"
                        data-permission-action="geolocation"
                        data-i18n="permessi.geo.pulsante">
                    </button>
                    <div class="permission-result"></div>
                </div>
            </details>

            <!-- Card 2: Dispositivi Multimediali Dettagliati -->
            <details class="permission-card">
                <summary data-i18n="permessi.media.titolo"></summary>
                <div>
                    <p data-i18n="permessi.media.testo"></p>
                    <p class="fp-section-tag" data-i18n="permessi.media.tag"></p>
                    <button
                        type="button"
                        class="btn-verde"
                        data-permission-action="media-devices"
                        data-i18n="permessi.media.pulsante">
                    </button>
                    <div class="permission-result"></div>

                    <!-- Contenitore miniatura snapshot fotocamera -->
                    <div class="camera-snapshot-container hidden">
                        <h3 data-i18n="permessi.media.foto"></h3>
                        <canvas id="camera-snapshot-canvas"></canvas>
                    </div>
                </div>
            </details>

            <!-- Card 3: Sensori Movimento Live -->
            <details class="permission-card">
                <summary data-i18n="permessi.sensori.titolo"></summary>
                <div>
                    <p data-i18n="permessi.sensori.testo"></p>
                    <p class="fp-section-tag" data-i18n="permessi.sensori.tag"></p>
                    <button
                        type="button"
                        class="btn-verde"
                        data-permission-action="motion-sensors"
                        data-i18n="permessi.sensori.pulsante">
                    </button>
                    <div class="permission-result"></div>
                </div>
            </details>

            <!-- Card 4: Condivisione dello schermo -->
            <details class="permission-card">
                <summary data-i18n="permessi.schermo.titolo"></summary>
                <div>
                    <p data-i18n="permessi.schermo.testo"></p>
                    <p class="fp-section-tag" data-i18n="permessi.schermo.tag"></p>
                    <button
                        type="button"
                        class="btn-verde"
                        data-permission-action="screen-capture"
                        data-i18n="permessi.schermo.pulsante">
                    </button>
                    <div class="permission-result"></div>
                </div>
            </details>

            <!-- Card 5: Lettura appunti -->
            <details class="permission-card">
                <summary data-i18n="permessi.appunti.titolo"></summary>
                <div>
                    <p data-i18n="permessi.appunti.testo"></p>
                    <p class="fp-section-tag" data-i18n="permessi.appunti.tag"></p>
                    <button
                        type="button"
                        class="btn-verde"
                        data-permission-action="clipboard-read"
                        data-i18n="permessi.appunti.pulsante">
                    </button>
                    <div class="permission-result"></div>
                </div>
            </details>

            <!-- Card 6: Periferiche USB e Bluetooth -->
            <details class="permission-card">
                <summary data-i18n="permessi.periferiche.titolo"></summary>
                <div>
                    <p data-i18n="permessi.periferiche.testo"></p>
                    <p class="fp-section-tag" data-i18n="permessi.periferiche.tag"></p>
                    <button
                        type="button"
                        class="btn-verde"
                        data-permission-action="usb"
                        data-i18n="permessi.periferiche.usb">
                    </button>
                    <button
                        type="button"
                        class="btn-verde"
                        data-permission-action="bluetooth"
                        data-i18n="permessi.periferiche.bluetooth">
                    </button>
                    <div class="permission-result">
                        <p data-i18n="permessi.periferiche.nonSupportate" hidden></p>
                        <div data-risultato="usb"></div>
                        <div data-risultato="bluetooth"></div>
                    </div>
                </div>
            </details>

            <!-- Avviso finale -->
            <div class="fp-warning">
                <strong data-i18n="permessi.nota.titolo"></strong>
                <span data-i18n="permessi.nota.testo"></span>
            </div>
        </section>

        <!-- Dati che la demo lascia nel browser -->
        <div class="demo-data">
            <p data-i18n="pagina.dati.testo"></p>
            <button type="button" id="clear-demo-data" class="btn-verde" data-i18n="pagina.dati.pulsante"></button>
            <p id="clear-demo-data-result" role="status"></p>
        </div>

    </main>

    <footer role="contentinfo">
        <p>
            <a href="https://github.com/AlbGri/digital-fingerprint" data-i18n="footer.codice"></a>
            &middot; <span data-i18n="footer.licenza"></span> <a href="https://www.gnu.org/licenses/agpl-3.0.html">AGPL-3.0</a>
        </p>
    </footer>
</body>
</html>
